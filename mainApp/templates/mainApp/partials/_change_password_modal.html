<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="changePasswordModalLabel">
                    <i class="fas fa-key me-2"></i>Change Password
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm">
                    {% csrf_token %}
                    
                    <!-- Old Password -->
                    <div class="mb-3">
                        <label for="old_password" class="form-label fw-bold">
                            <i class="fas fa-lock me-2"></i>Current Password
                        </label>
                        <input type="password" 
                               class="form-control form-control-lg" 
                               id="old_password" 
                               name="old_password" 
                               required
                               placeholder="Enter your current password">
                        <div class="invalid-feedback" id="old_password_error"></div>
                    </div>
                    
                    <!-- New Password -->
                    <div class="mb-3">
                        <label for="new_password1" class="form-label fw-bold">
                            <i class="fas fa-key me-2"></i>New Password
                        </label>
                        <input type="password" 
                               class="form-control form-control-lg" 
                               id="new_password1" 
                               name="new_password1" 
                               required
                               placeholder="Enter new password">
                        <div class="invalid-feedback" id="new_password1_error"></div>
                        <small class="form-text text-muted">
                            <i class="fas fa-info-circle me-1"></i>
                            Password must contain uppercase, lowercase, number, and special character (@$!%*?&), minimum 6 characters.
                        </small>
                    </div>
                    
                    <!-- Confirm New Password -->
                    <div class="mb-3">
                        <label for="new_password2" class="form-label fw-bold">
                            <i class="fas fa-check-circle me-2"></i>Confirm New Password
                        </label>
                        <input type="password" 
                               class="form-control form-control-lg" 
                               id="new_password2" 
                               name="new_password2" 
                               required
                               placeholder="Confirm your new password">
                        <div class="invalid-feedback" id="new_password2_error"></div>
                    </div>
                    
                    <!-- Form Level Error -->
                    <div id="formErrors" class="alert alert-danger d-none"></div>
                    
                    <!-- Success Message -->
                    <div id="successMessage" class="alert alert-success d-none"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-lg" data-bs-dismiss="modal">
                    <i class="fas fa-times me-2"></i>Cancel
                </button>
                <button type="button" class="btn btn-primary btn-lg" id="submitPasswordChange">
                    <i class="fas fa-save me-2"></i>Update Password
                </button>
            </div>
        </div>
    </div>
</div>
